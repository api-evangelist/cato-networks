aid: cato-networks
name: Cato Networks
description: 'Cato Networks is the SASE (Secure Access Service Edge) pioneer, delivering
  networking and security as a single global cloud platform that converges SD-WAN, a
  global private backbone, and a full cloud security stack — FWaaS, Secure Web Gateway,
  CASB, DLP, ZTNA/SDP, IPS, anti-malware, Remote Browser Isolation, and XDR. Cato
  exposes a public GraphQL API (api/v1/graphql2) for programmatic management, analytics,
  and event streaming of the Cato Management Application (CMA), authenticated with an
  API key sent in the x-api-key header. The official developer surface includes a Python
  CLI (catocli), a Go SDK (cato-go-sdk), a Terraform provider (catonetworks/cato), a
  local Model Context Protocol server (cato-mcp-server), and a web-based API explorer.'
